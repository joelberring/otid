name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: otid
          POSTGRES_PASSWORD: otid
          POSTGRES_DB: otid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otid -d otid_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://otid:otid@localhost:5432/otid_test
      TEST_DATABASE_URL: postgresql://otid:otid@localhost:5432/otid_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      # Webbläsartesterna slås ihop till en gemensam konfiguration i steg 1 och 5
      # (PLAN.md). Tills dess körs de inte i CI.
