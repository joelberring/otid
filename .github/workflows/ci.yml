name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: otid
          POSTGRES_PASSWORD: otid
          POSTGRES_DB: otid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otid -d otid_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://otid:otid@localhost:5432/otid_test
      TEST_DATABASE_URL: postgresql://otid:otid@localhost:5432/otid_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      # Webbläsartesterna körs i jobbet production mot det byggda driftpaketet. Utvecklingsservern
      # kompilerar routes vid första anropet och gav ibland 404 i CI.

  production:
    # Steg 6: hela driftuppsättningen (Dockerfile, Caddy, PostgreSQL, backup) med webbläsartesterna mot HTTPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Eventor: slumpad masternyckel och den falska Eventor som Playwrights global-setup startar på värden (port 4319).
      # E-post: den falska SMTP-servern från global-setup (port 4325). Många testkonton från samma adress.
      # Radio: den falska ROC-servern från global-setup (port 4331).
      - run: |
          printf 'OTID_DOMAIN=localhost\nPOSTGRES_PASSWORD=endast-for-ci\n' > .env
          printf 'OTID_EVENTOR_MASTER_KEY=%s\nOTID_EVENTOR_BASE_URL=http://host.docker.internal:4319\n' "$(openssl rand -base64 32)" >> .env
          printf 'OTID_SMTP_URL=smtp://host.docker.internal:4325\nOTID_MAIL_FROM=O-Tid test <noreply@o-tid.test>\n' >> .env
          printf 'OTID_REGISTRATION_LIMIT_PER_HOUR=1000\n' >> .env
          printf 'OTID_ROC_BASE_URL=http://host.docker.internal:4331\n' >> .env
      - run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 600
      - run: curl -sfk --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null https://localhost/organizer
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: https://localhost
      - run: ls -lR backups && ls backups/hourly/otid-*.dump backups/daily/otid-*.dump
      - if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 200
      # Endast diagnos (gren diag-54-listor, slås inte ihop): läget i databasen för listortestets tävlingar.
      - if: failure()
        run: |
          q() { docker compose -f docker-compose.prod.yml exec -T postgres psql -U otid -d otid -At -F' ' -c "$1" | tr '\n' '|' | cut -c1-3500; }
          echo "::warning title=lopp::$(q "select r.id, r.name, e.time_zone, r.race_date from race r join event e on e.id=r.event_id where r.name like 'Listor%' order by r.created_at")"
          echo "::warning title=resultat::$(q "select r.name, c.name, en.given_name, rr.revision, rr.status, rr.cause, rr.published, rr.created_at::time from result_revision rr join entry en on en.id=rr.entry_id join class c on c.id=en.class_id join race r on r.id=rr.race_id where r.name like 'Listor%' order by r.created_at, rr.created_at")"
          echo "::warning title=avlasningar::$(q "select r.name, cr.card_number, cr.finish_punched_at::time, cr.read_at::time, o.server_result->>'status' from card_readout cr join race r on r.id=cr.race_id left join device_ingest_outcome o on o.raw_message_id=cr.raw_message_id where r.name like 'Listor%' order by r.created_at, cr.read_at")"
          echo "::warning title=ramar::$(q "select r.name, count(*), min(m.local_sequence), max(m.local_sequence) from raw_device_message m join race r on r.id=m.race_id where r.name like 'Listor%' group by r.name, r.created_at order by r.created_at")"
          echo "::warning title=webbfel::$(docker compose -f docker-compose.prod.yml logs web 2>&1 | grep -iE 'error|fel|kunde' | tail -15 | tr '\n' '|' | cut -c1-3500)"
          echo "::warning title=publikfel::$(docker compose -f docker-compose.prod.yml logs web-public web-public2 2>&1 | grep -iE 'error|fel|kunde' | tail -15 | tr '\n' '|' | cut -c1-3500)"
