name: CI

on:
  push:
  pull_request:

# ADR-0185: jobben läser bara koden; inget skrivs tillbaka till repot.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-trixie
        env:
          POSTGRES_USER: otid
          POSTGRES_PASSWORD: otid
          POSTGRES_DB: otid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otid -d otid_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://otid:otid@localhost:5432/otid_test
      TEST_DATABASE_URL: postgresql://otid:otid@localhost:5432/otid_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # pg_dump i integrationstesterna (steg 59) måste ha samma huvudversion som servern (postgres:17).
      - name: pg_dump 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pnpm test:integration
      - run: pnpm build
      # Webbläsartesterna körs i jobbet production mot det byggda driftpaketet. Utvecklingsservern
      # kompilerar routes vid första anropet och gav ibland 404 i CI.

  production:
    # Steg 6: hela driftuppsättningen (Dockerfile, Caddy, PostgreSQL, backup) med webbläsartesterna mot HTTPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Eventor: slumpad masternyckel och den falska Eventor som Playwrights global-setup startar på värden (port 4319).
      # E-post: den falska SMTP-servern från global-setup (port 4325). Många testkonton från samma adress.
      # Radio: den falska ROC-servern från global-setup (port 4331).
      - run: |
          printf 'OTID_DOMAIN=localhost\nPOSTGRES_PASSWORD=endast-for-ci\n' > .env
          printf 'OTID_EVENTOR_MASTER_KEY=%s\nOTID_EVENTOR_BASE_URL=http://host.docker.internal:4319\n' "$(openssl rand -base64 32)" >> .env
          printf 'OTID_SMTP_URL=smtp://host.docker.internal:4325\nOTID_MAIL_FROM=O-Tid test <noreply@o-tid.test>\n' >> .env
          printf 'OTID_REGISTRATION_LIMIT_PER_HOUR=1000\n' >> .env
          printf 'OTID_ROC_BASE_URL=http://host.docker.internal:4331\n' >> .env
          # Hälsokontrollen: CI-maskinens disk är ofta fullare än 80 %.
          printf 'OTID_DISK_ALERT_PERCENT=97\n' >> .env
      - run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 600
      - run: curl -sfk --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null https://localhost/organizer
      # ADR-0185: övergången till databasroller på den körande servern, med samma steg som docs/drift.md; webbläsartesterna
      # körs sedan med rollerna (otid_app i webben, otid_print i utskriftsarbetaren, otid_owner för migrering och backup).
      - run: sh deploy/db-roles.sh setup
      - run: sh deploy/db-roles.sh check | tee roles-check.txt && ! grep -q '^FEL' roles-check.txt
      - run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 600
      - run: |
          docker compose -f docker-compose.prod.yml exec -T postgres psql -U otid -d otid -Atc \
            "select usename from pg_stat_activity where datname = 'otid' and backend_type = 'client backend' group by 1 order by 1" | tee roles-used.txt
          grep -q otid_app roles-used.txt
      - run: curl -sfk --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null https://localhost/organizer
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: https://localhost
      # ADR-0185: dumpen före migreringen, timdumpen och dagsbackupen; hälsokontrollen en gång.
      - run: ls -lR backups && ls backups/hourly/otid-*.dump backups/daily/otid-*.dump backups/fore-migrering/otid-*.dump
      - run: docker compose -f docker-compose.prod.yml exec -T monitor sh /monitor.sh once
      - if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 200
