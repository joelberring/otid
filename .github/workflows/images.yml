name: Avbildningar

# ADR-0195: färdiga avbildningar för servern. När CI är grön för en push till main byggs webben (Dockerfile) och backupen
# (deploy/backup.Dockerfile) för linux/amd64 och läggs i GitHub Container Registry:
#   ghcr.io/joelberring/otid-web:<sha>, :<kort sha>, :main
#   ghcr.io/joelberring/otid-backup:<sha>, :<kort sha>, :main
# Servern hämtar dem med `docker compose -f docker-compose.prod.yml pull` (docs/drift.md, Uppdatera) och bygger inget själv.
# På andra grenar byggs avbildningarna bara (inget läggs upp) när något som påverkar dem ändras, för att se att det går.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches-ignore: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/backup.Dockerfile
      - apps/web/next.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/images.yml

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/joelberring

jobs:
  # Bara bygge, ingen inloggning och ingen skrivrätt till paketen.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: otid-web
            context: .
            file: Dockerfile
          - image: otid-backup
            context: deploy
            file: deploy/backup.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Läggs upp bara efter grön CI för en push till main i det här repot (aldrig för en pull request eller en fork).
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # En publicering i taget, i den ordning CI blev klar.
    concurrency:
      group: images-main
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: otid-web
            context: .
            file: Dockerfile
          - image: otid-backup
            context: deploy
            file: deploy/backup.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Taggen main flyttas bara om commiten fortfarande är mains senaste (en äldre körning som blir klar sist får bara
      # sina sha-taggar).
      - id: tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$SHA"
            echo "$IMAGE:${SHA::7}"
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SHA" ]; then echo "$IMAGE:main"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
