<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O-Tid</title>
  <style>
    body { margin: 0; padding: 2rem 1.5rem; font: 1.125rem/1.5 system-ui, sans-serif; color: #111; background: #fff; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    a { display: inline-block; margin-top: 1.5rem; padding: 0.9rem 1.4rem; border: 2px solid #111; border-radius: 0.5rem;
        color: #111; text-decoration: none; font-weight: 600; }
  </style>
  <script src="server-url.js"></script>
</head>
<body>
  <h1>O-Tid nås inte</h1>
  <p>Appen hittar inte O-Tids server. Kontrollera att telefonen har nät och försök igen.</p>
  <p>En spårning som redan pågår fortsätter och sparas i telefonen.</p>
  <a id="retry" href="https://otid.berring.se">Försök igen</a>
  <script>
    if (typeof window.OTID_SERVER_URL === "string") document.getElementById("retry").href = window.OTID_SERVER_URL;
  </script>
</body>
</html>
