# Drift på en vanlig VPS (ADR-0168, steg 6). Se docs/drift.md.
# Kräver en .env bredvid filen med OTID_DOMAIN och POSTGRES_PASSWORD.
name: otid

# Steg 45: loggarna får inte fylla disken (högst 5 × 10 MB per tjänst).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    # Vanlig PostgreSQL för alla arkitekturer (steg 28); samma datakatalog som den tidigare PostGIS-bilden.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: otid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}
      POSTGRES_DB: otid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Steg 54 (ADR-0177, docs/drift.md): databasen och tävlingens webb går före publiken när processorn inte räcker
    # (cpu_shares är vikter: 1024 mot web-publics 256), och varje tjänst har ett minnestak på CX23 (4 GB).
    cpu_shares: 1024
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otid -d otid"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Steg 54: tävlingens instans – arbetsytan, avläsningen, funktionärerna, inloggningen och admin-API:t. Migrerar databasen
  # och hämtar radiostämplingar. Caddy skickar hit allt utom publika sidor för besökare utan inloggning.
  web:
    logging: *logging
    build: .
    image: otid-web
    restart: unless-stopped
    cpu_shares: 1024
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    environment: &web-environment
      DATABASE_URL: postgresql://otid:${POSTGRES_PASSWORD}@postgres:5432/otid
      O_TID_PUBLIC_ORIGIN: https://${OTID_DOMAIN:?Sätt OTID_DOMAIN i .env}
      # Eventor (docs/drift.md): masternyckel för klubbarnas API-nycklar. Tom = Eventor avstängt.
      OTID_EVENTOR_MASTER_KEY: ${OTID_EVENTOR_MASTER_KEY:-}
      # Endast test (CI pekar på en falsk Eventor på värden). Tom i drift = Eventor Sverige.
      OTID_EVENTOR_BASE_URL: ${OTID_EVENTOR_BASE_URL:-}
      # E-post för återställningslänkar (docs/drift.md). Tom = ingen e-post; superadmin skapar länken.
      OTID_SMTP_URL: ${OTID_SMTP_URL:-}
      OTID_MAIL_FROM: ${OTID_MAIL_FROM:-}
      OTID_CONTACT_EMAIL: ${OTID_CONTACT_EMAIL:-}
      # Hemlighet för spärrarnas hash (docs/drift.md). Tom = härleds ur DATABASE_URL, så inget behöver läggas till.
      OTID_THROTTLE_SECRET: ${OTID_THROTTLE_SECRET:-}
      # Registreringar per IP och timme. Tom = 10. CI höjer gränsen för webbläsartesterna.
      OTID_REGISTRATION_LIMIT_PER_HOUR: ${OTID_REGISTRATION_LIMIT_PER_HOUR:-}
      # Radiokontroller (docs/drift.md). Endast test: CI pekar på en falsk ROC på värden. Tom i drift = ROC/OResults.
      OTID_ROC_BASE_URL: ${OTID_ROC_BASE_URL:-}
      # off = den här instansen hämtar inga radiostämplingar. Tom = hämtar (bara en instans åt gången, PostgreSQL-lås).
      OTID_RADIO_POLLER: ${OTID_RADIO_POLLER:-}
      OTID_INSTANCE_ROLE: competition
      NODE_OPTIONS: --max-old-space-size=768
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/organizer').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Steg 54 (ADR-0177, docs/lasttest.md): publikens instanser – publika sidor och API:er, Live och resultatströmmen. Två,
  # eftersom en Node-process bara använder en kärna; Caddy fördelar publiken mellan dem. Lägre CPU-vikt än web och
  # databasen (256 mot 1024): när processorn inte räcker blir resultatredovisningen långsammare, inte avläsningen. Egen
  # liten databaspool med tidsgräns och lastavlastning (äldre lista, glesare uppdatering, sist 503 med Retry-After).
  # Startar när web har migrerat, migrerar inte och hämtar inga radiostämplingar.
  web-public: &web-public
    logging: *logging
    image: otid-web
    restart: unless-stopped
    cpu_shares: 256
    mem_limit: 768m
    depends_on:
      web:
        condition: service_healthy
    environment:
      <<: *web-environment
      OTID_RADIO_POLLER: "off"
      OTID_INSTANCE_ROLE: public
      NODE_OPTIONS: --max-old-space-size=512
    command: ["node", "apps/web/server.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/om').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  web-public2: *web-public

  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      web-public:
        condition: service_healthy
      web-public2:
        condition: service_healthy
    cpu_shares: 1024
    mem_limit: 192m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OTID_DOMAIN: ${OTID_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    cpu_shares: 128
    mem_limit: 192m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: otid
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: otid
      BACKUP_DIR: /backups
      # Steg 45: varje hel timme kl. 08–23 svensk tid; de 48 senaste timdumparna och en dagsbackup i 14 dagar.
      TZ: Europe/Stockholm
      BACKUP_FIRST_HOUR: "8"
      BACKUP_LAST_HOUR: "23"
      BACKUP_KEEP_HOURLY: "48"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
