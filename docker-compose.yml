services:
  postgres:
    # Vanlig PostgreSQL för alla arkitekturer (steg 28). Samma huvudversion och datakatalog (/var/lib/postgresql/data)
    # som den tidigare postgis/postgis:17-3.5, så en befintlig volym används som den är (docs/drift.md).
    image: postgres:17
    environment:
      POSTGRES_USER: otid
      POSTGRES_PASSWORD: otid
      POSTGRES_DB: otid
    ports:
      # 5433 på datorn, så att en egen PostgreSQL på 5432 inte krockar.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otid -d otid"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
